[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geotransfer-gap"
version = "0.1.0"
description = "Validated levelXdata scene transfer to BehaviorBench / PufferDrive"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "matplotlib", "Pillow"]

[project.optional-dependencies]
test = ["pytest"]
native-map = ["lanelet2==1.2.3"]
evaluation-geometry = ["shapely>=2.0,<3"]

[project.scripts]
geotransfer = "geotransfer_gap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
geotransfer_gap = ["tool_registry.json", "visualization/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires BB, source data, native runtime and model assets"]
