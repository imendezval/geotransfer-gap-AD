<!doctype html><html lang="en"><meta charset="utf-8"><title>GeoTransfer playback</title>
<style>body{font:15px system-ui;margin:20px;background:#f3f5f8;color:#182331}header,nav{margin-bottom:14px}button,select{padding:7px;margin-right:8px}input{width:45%}main{display:flex;gap:12px;flex-wrap:wrap}section{flex:1;min-width:320px;max-width:700px;background:white;padding:10px;border-radius:8px}canvas{width:100%;height:auto}pre{white-space:pre-wrap;font-size:12px}small{display:block;max-width:1100px;margin-top:10px}</style>
<header><h1 id="title"></h1><small id="notice"></small></header>
<nav><button id="play">Play</button><input id="time" aria-label="Time" type="range" min="0" max="90" value="0"><span id="clock"></span><label><input type="checkbox" id="aerial" style="width:auto" checked>Aerial</label></nav>
<main><section><h2>Source recording</h2><canvas id="left" width="700" height="600"></canvas></section><section><h2><select id="mode" aria-label="Comparison view"><option value="converted">Converted scene</option></select></h2><canvas id="right" width="700" height="600"></canvas><p id="events"></p></section></main>
<small>Red: ego. Blue: vehicles. Green: pedestrians/cyclists. Boxes follow supplied or explicitly estimated dimensions. Playback uses metres and a synchronized 0.1 s timeline; source samples are interpolated from the 25 Hz recording.</small>
<details><summary>Provenance and interpretation limits</summary><pre id="provenance"></pre></details>
<script>
const D=__DATA__;
document.getElementById('title').textContent=D.scene;document.getElementById('notice').textContent=D.provenance.notice;
document.getElementById('provenance').textContent=JSON.stringify({source:D.provenance,runs:D.runs.map(r=>r.provenance)},null,2);
const slider=document.getElementById('time'),mode=document.getElementById('mode'),img=new Image();
D.runs.forEach((r,i)=>{const o=document.createElement('option');o.value=i;o.textContent=r.name+' evaluator rollout';mode.appendChild(o)});
let timer=null;const points=D.source.flatMap(f=>f.actors.filter(a=>a.id===D.ego_id&&a.present));
const xmin=Math.min(...points.map(p=>p.x))-25,xmax=Math.max(...points.map(p=>p.x))+25,ymin=Math.min(...points.map(p=>p.y))-25,ymax=Math.max(...points.map(p=>p.y))+25;
const scale=Math.min(680/(xmax-xmin),580/(ymax-ymin)),X=x=>10+(x-xmin)*scale,Y=y=>590-(y-ymin)*scale;
function draw(id,frame){const c=document.getElementById(id).getContext('2d');c.clearRect(0,0,700,600);c.fillStyle='#f8fafc';c.fillRect(0,0,700,600);
 const reg=D.registration;if(img.complete&&img.naturalWidth&&document.getElementById('aerial').checked){c.globalAlpha=.8;c.drawImage(img,X(reg.local_x_at_image_x0_m),Y(reg.local_y_at_image_y0_m),img.width*reg.pixel_scale_m*scale,img.height*reg.pixel_scale_m*scale);c.globalAlpha=1}
 for(const road of D.roads){const pts=road.geometry;if(!pts||!pts.length)continue;c.beginPath();pts.forEach((p,i)=>i?c.lineTo(X(p.x),Y(p.y)):c.moveTo(X(p.x),Y(p.y)));c.strokeStyle=road.type==='crosswalk'?'#dbb600':'#727c89';c.lineWidth=road.type==='lane'?.7:1.5;c.stroke()}
 c.strokeStyle='#d52f35';c.beginPath();points.forEach((p,i)=>i?c.lineTo(X(p.x),Y(p.y)):c.moveTo(X(p.x),Y(p.y)));c.stroke();c.fillStyle='#ae1d92';c.fillRect(X(D.goal.x)-4,Y(D.goal.y)-4,8,8);
 if(!frame){c.fillStyle='#333';c.fillText('Run ended; no further observed state',20,25);return}
 for(const a of frame.actors){if(!a.present)continue;const ego=a.id===D.ego_id,vehicle=a.type===1||a.type==='vehicle';c.save();c.translate(X(a.x),Y(a.y));c.rotate(-a.heading);c.strokeStyle=ego?'#d52f35':vehicle?'#087fd0':'#00803d';c.lineWidth=ego?3:1.5;c.strokeRect(-a.length*scale/2,-a.width*scale/2,a.length*scale,a.width*scale);c.beginPath();c.moveTo(0,0);c.lineTo(a.length*scale/2,0);c.stroke();c.restore();c.fillStyle='#101820';c.fillText(String(a.id),X(a.x)+4,Y(a.y)-4)}
}
function update(){const t=+slider.value;document.getElementById('clock').textContent=(t*.1).toFixed(1)+' s';draw('left',D.source[t]);const run=mode.value==='converted'?null:D.runs[+mode.value];
 let frame=run?run.frames.find(f=>f.step===t):D.converted[t];draw('right',frame);
 document.getElementById('events').textContent=frame?frame.actors.filter(a=>a.collision_state||a.removed||a.reached_goal).map(a=>a.id+': '+(a.collision_state?'collision/off-road':a.reached_goal?'goal':'removed')).join('; '):'Rollout ended';}
slider.oninput=update;mode.onchange=update;document.getElementById('aerial').onchange=update;document.getElementById('play').onclick=()=>{if(timer){clearInterval(timer);timer=null;document.getElementById('play').textContent='Play'}else{document.getElementById('play').textContent='Pause';timer=setInterval(()=>{slider.value=(+slider.value+1)%91;update()},100)}};
img.onload=update;img.src=D.image;update();
</script></html>
